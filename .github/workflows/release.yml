name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: go vet -tags nogui ./...
      - run: go test -tags nogui ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser regression gate
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tests" playwright@1.62.1
          node "$RUNNER_TEMP/browser-tests/node_modules/playwright/cli.js" install --with-deps chromium webkit
          NODE_PATH="$RUNNER_TEMP/browser-tests/node_modules" node --test internal/gui/tests/grokbot-launch.test.cjs internal/gui/tests/agy-launch.test.cjs
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make release-cli release-windows VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-windows
          path: dist/*
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: amd64
            family: darwin
          - os: macos-latest
            arch: arm64
            family: darwin
          - os: ubuntu-24.04
            arch: amd64
            family: linux
          - os: ubuntu-24.04-arm
            arch: arm64
            family: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Linux dependencies
        if: matrix.family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev xvfb dbus-x11
      - name: Build macOS app
        if: matrix.family == 'darwin'
        run: |
          make app VERSION="${GITHUB_REF_NAME#v}"
          codesign --force --deep --sign - magpie.app
          mkdir -p dist
          ditto -c -k --keepParent magpie.app dist/magpie-darwin-${{ matrix.arch }}.zip
          ./magpie --version | grep -F "magpie ${GITHUB_REF_NAME#v}"
      - name: Build Linux app
        if: matrix.family == 'linux'
        run: |
          make release-linux TAGS='production gtk3' VERSION="${GITHUB_REF_NAME#v}"
          dist/magpie-linux-${{ matrix.arch }} --version | grep -F "magpie ${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.family }}-${{ matrix.arch }}
          path: dist/*
  publish:
    needs: [verify, cli, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Prepare verified update feed
        run: python3 scripts/release-feed.py "${GITHUB_REF_NAME#v}" dist docs/releases/grokbot-1.md
      - name: Publish fork release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft --title "Magpie ${GITHUB_REF_NAME#v} — Grok Bot" --notes-file docs/releases/grokbot-1.md
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
